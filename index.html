<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArcLight SMP Tierlist</title><style>body{margin:0;background:#101217;color:#fff;font:16px Arial}.head{text-align:center;padding:20px;background:#171a21}.logo{max-width:300px;max-height:90px}.wrap{max-width:1050px;margin:20px auto;padding:0 10px}.tier{display:flex;min-height:95px;margin:8px 0;background:#191d25;border:1px solid #303642;border-radius:10px;overflow:hidden}.label{width:70px;display:grid;place-items:center;font-size:30px;font-weight:900}.drop{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px}.p{width:80px;height:80px;object-fit:cover;border-radius:8px;border:2px solid #444;cursor:grab;touch-action:none}.over{background:#272d38}.S{background:#e74c3c}.A{background:#e67e22}.B{background:#f1c40f;color:#111}.C{background:#2ecc71}.D{background:#3498db}.F{background:#9b59b6}button,input,select{padding:8px;border-radius:7px;border:1px solid #444;background:#101217;color:#fff}button{background:#5865f2;border:0}.admin{background:#171a21;padding:12px;border-radius:10px;margin-bottom:15px}@media(max-width:600px){.label{width:55px}.p{width:65px;height:65px}.logo{max-width:230px}}</style></head><body><div class="head"><img class="logo" src="arclight-logo.png"><h1>ArcLight SMP Tierlist</h1><div>Overall Rankings</div></div><div class="wrap"><div class="admin"><input id="pw" type="password" placeholder="Admin password"><button onclick="login()">Admin Login</button><span id="msg"></span><div id="panel" style="display:none;margin-top:10px"><select id="sel"><option>S</option><option>A</option><option>B</option><option>C</option><option>D</option><option>F</option></select><input id="files" type="file" accept="image/*" multiple><button onclick="logout()">Logout</button></div></div><div id="board"></div><p style="text-align:center;color:#929aa8;font-size:13px">Admin: upload images, then drag them between tiers. On tablet, press and hold an image, then drag.</p></div><script>
const PASS='CHANGE_THIS_PASSWORD', tiers=['S','A','B','C','D','F'];let data=JSON.parse(localStorage.getItem('arcTier'))||{S:[],A:[],B:[],C:[],D:[],F:[]},admin=false,drag=null,timer=null;
function save(){localStorage.setItem('arcTier',JSON.stringify(data))}function render(){board.innerHTML='';tiers.forEach(t=>{let row=document.createElement('div');row.className='tier';let lab=document.createElement('div');lab.className='label '+t;lab.textContent=t;let z=document.createElement('div');z.className='drop';z.dataset.t=t;z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();z.classList.remove('over');if(admin&&drag)move(drag.t,drag.i,t)};data[t].forEach((src,i)=>{let im=document.createElement('img');im.src=src;im.className='p';im.draggable=admin;im.ondragstart=()=>drag={t,i};im.ondragend=()=>drag=null;im.onclick=()=>{if(admin&&confirm('Remove this image?')){data[t].splice(i,1);save();render()}};im.ontouchstart=()=>{if(admin)timer=setTimeout(()=>{drag={t,i};im.style.opacity=.35},350)};im.ontouchmove=e=>{if(!drag)return;e.preventDefault();let q=e.touches[0],el=document.elementFromPoint(q.clientX,q.clientY),dz=el&&el.closest('.drop');document.querySelectorAll('.drop').forEach(x=>x.classList.remove('over'));if(dz)dz.classList.add('over')};im.ontouchend=e=>{clearTimeout(timer);if(!drag)return;let q=e.changedTouches[0],el=document.elementFromPoint(q.clientX,q.clientY),dz=el&&el.closest('.drop');document.querySelectorAll('.drop').forEach(x=>x.classList.remove('over'));im.style.opacity=1;if(dz)move(drag.t,drag.i,dz.dataset.t);drag=null};z.appendChild(im)});row.append(lab,z);board.appendChild(row)})}function move(a,i,b){data[b].push(data[a].splice(i,1)[0]);save();render()}function login(){if(pw.value===PASS){admin=true;document.querySelector('.admin').classList.add('ok');document.getElementById('panel').style.display='block';pw.style.display='none';document.querySelector('button').style.display='none';msg.textContent=' Admin mode on';render()}else msg.textContent=' Wrong password'}function logout(){location.reload()}files.onchange=e=>{if(!admin)return;[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{data[sel.value].push(r.result);save();render()};r.readAsDataURL(f)});e.target.value=''}render();
</script></body></html>
